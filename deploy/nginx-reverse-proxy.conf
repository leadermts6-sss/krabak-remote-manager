# SAMPLE CONFIG ONLY. Use aaPanel Website > Reverse Proxy (or a custom Nginx site).
# Change remote.example.ac.th to the real domain. Configure SSL via aaPanel.
# Place inside Nginx server {} for the dedicated remote manager vhost:

location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
}
# TLS, gzip, other headers and Cloudflare/WAF policies should be set in aaPanel.
# The Node backend binds to 127.0.0.1:8787; no new public port required.
