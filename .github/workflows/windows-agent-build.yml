name: Windows Agent CI

on:
  push:
    branches: [main, codex/windows-agent-control]
    paths:
      - 'agent/windows/**'
      - '.github/workflows/windows-agent-build.yml'
  pull_request:
    paths:
      - 'agent/windows/**'
      - '.github/workflows/windows-agent-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-build-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Compile unsigned development build for CI only
        run: >-
          dotnet publish agent/windows/KrabakRemoteAgent.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/krabak-agent-unsigned-development
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:AgentChannel=Development
