name: Windows Agent CI and signed release

on:
  push:
    branches: [main, codex/windows-agent-control]
    tags: ['v*']
    paths:
      - 'agent/windows/**'
      - '.github/workflows/windows-agent-build.yml'
  pull_request:
    paths:
      - 'agent/windows/**'
      - '.github/workflows/windows-agent-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-build-check:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Compile unsigned development build for CI only
        run: >-
          dotnet publish agent/windows/KrabakRemoteAgent.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/krabak-agent-unsigned-development
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:AgentChannel=Development
  production-checks:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Confirm the release tag points to main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test restricted release receiver
        run: python -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Build frontend
        run: npm run build
      - name: Test Node application and built client
        run: npm test

  signed-production-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: production-checks
    runs-on: windows-2025
    environment: code-signing
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Build production Agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Production tags must use stable vX.Y.Z format.' }
          $output = 'artifacts/krabak-agent-production'
          dotnet publish agent/windows/KrabakRemoteAgent.csproj `
            --configuration Release --runtime win-x64 --self-contained true --output $output `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false -p:AgentChannel=Production -p:Version=$version
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          Copy-Item agent/windows/README_TH.md (Join-Path $output 'README_TH.md')
      - name: Check Artifact Signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','AZURE_ARTIFACT_SIGNING_ENDPOINT','AZURE_ARTIFACT_SIGNING_ACCOUNT','AZURE_ARTIFACT_SIGNING_PROFILE')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count) { throw ('Production release blocked; configure code-signing environment values: ' + ($missing -join ', ')) }
      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign with Microsoft Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\krabak-agent-production
          files-folder-filter: KRABAK.RemoteAgent.exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          timeout: 600
      - name: Verify Authenticode signature and timestamp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'artifacts/krabak-agent-production/KRABAK.RemoteAgent.exe'
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK SignTool.exe was not found on the runner.' }
          & $signTool.FullName verify /pa /all /v $exe
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed.' }
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate) {
            throw 'Agent signature, public trust chain, or RFC 3161 timestamp is invalid.'
          }
          if ($signature.SignerCertificate.EnhancedKeyUsageList.ObjectId.Value -notcontains '1.3.6.1.5.5.7.3.3') {
            throw 'The signer certificate does not have the Code Signing EKU.'
          }
          Write-Host ('Verified public-trust signer: ' + $signature.SignerCertificate.Subject)
      - name: Create and publish the signed GitHub Release
        shell: pwsh
        env:
          GH_RELEASE_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $zipPath = Join-Path $env:RUNNER_TEMP "KRABAK-Agent-$version-win-x64.zip"
          Compress-Archive -Path 'artifacts/krabak-agent-production/*' -DestinationPath $zipPath -CompressionLevel Optimal
          $apiHeaders = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_RELEASE_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releaseBody = @{ tag_name = $env:GITHUB_REF_NAME; name = "KRABAK Windows Agent $version"; generate_release_notes = $true; draft = $true; prerelease = $false } | ConvertTo-Json
          $release = $null
          $releasePublished = $false
          try {
            $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $apiHeaders -ContentType 'application/json' -Body $releaseBody
            $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''
            $assetHeaders = @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GH_RELEASE_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
              'Content-Type' = 'application/zip'
            }
            $assetUri = "${uploadUrl}?name=KRABAK-Agent-$version-win-x64.zip"
            Invoke-RestMethod -Method Post -Uri $assetUri -Headers $assetHeaders -InFile $zipPath | Out-Null
            $publishBody = @{ draft = $false; prerelease = $false } | ConvertTo-Json
            Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -Headers $apiHeaders -ContentType 'application/json' -Body $publishBody | Out-Null
            $releasePublished = $true
            Write-Host "Published signed KRABAK Windows Agent $version after Authenticode verification."
          }
          finally {
            if ($release -and -not $releasePublished) { try { Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -Headers $apiHeaders | Out-Null } catch {} }
          }
